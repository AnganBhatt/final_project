<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assest/style/boostrap-css.css">
    <link rel="stylesheet" href="./assest/style/style.css">
    <link rel="stylesheet" href="./assest/style/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <linkdiscount-banner
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
        <title>Document</title>
</head>

<body>
    <section class="singup">
        <div class="container">
            <div class="siginup-card">
                <h4>Sign In</h4>
                <div class="siginup-from">
                    <input type="email" placeholder="email">
                    <div class="password-box">
                        <input type="password" placeholder="password" class="password">
                        <div class="password-icons">
                            <button class="pass-btn-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                                    viewBox="0 0 1024 1024">
                                    <path d="M0 0h1024v1024H0z" fill="none" />
                                    <path fill="currentColor"
                                        d="M942.2 486.2C847.4 286.5 704.1 186 512 186c-192.2 0-335.4 100.5-430.2 300.3a60.3 60.3 0 0 0 0 51.5C176.6 737.5 319.9 838 512 838c192.2 0 335.4-100.5 430.2-300.3c7.7-16.2 7.7-35 0-51.5M512 766c-161.3 0-279.4-81.8-362.7-254C232.6 339.8 350.7 258 512 258s279.4 81.8 362.7 254C791.5 684.2 673.4 766 512 766m-4-430c-97.2 0-176 78.8-176 176s78.8 176 176 176s176-78.8 176-176s-78.8-176-176-176m0 288c-61.9 0-112-50.1-112-112s50.1-112 112-112s112 50.1 112 112s-50.1 112-112 112" />
                                </svg>
                            </button>
                            <button class="pass-btn-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                                    <path d="M0 0h24v24H0z" fill="none" />
                                    <path fill="none" stroke="currentColor" stroke-linecap="round"
                                        stroke-linejoin="round" stroke-width="2"
                                        d="M2 10s3.5 4 10 4s10-4 10-4M4 11.645L2 14m20 0l-1.996-2.352M8.914 13.68L8 16.5m7.063-2.812L16 16.5" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="remeber d-flex">
                        <div class="d-flex">
                            <input type="checkbox">
                            <p>Remember me</p>
                        </div>
                        <div>
                            <a href="#">Forget Password</a>
                        </div>
                    </div>
                    <a href="#" class="Login">
                        Login
                    </a>
                    <div class="d-flex register justify-content-center py-2 ">
                        <p>Don’t have account?</p>
                        <a href="#"> Register</a>
                    </div>

                </div>
            </div>
    </section>
    <script src="./assest/javascript/script.js"></script>
</body>

</html>
